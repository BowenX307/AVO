<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AVO intro (video)</title>
    <!-- The site's opening, as a video frame source: the logo draws, the AVO cursor
         clicks the O, and the O opens into plain white. render(ms) sets every frame
         from time alone, so video/render_intro.mjs can step it frame by frame. -->
    <link rel="stylesheet" href="../brand/tokens.css" />
    <style>
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0a0a0a; }
      #logo { position: absolute; left: 50%; top: 50%; width: 680px; transform: translate(-50%, -50%); color: #f5f5f2; }
      #logo svg { width: 100%; height: auto; overflow: visible; }
      #white { position: absolute; width: 2px; height: 2px; margin: -1px 0 0 -1px; border-radius: 50%; background: #ffffff; transform: scale(0); }
      #ripple { position: absolute; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%; border: 1.5px solid #f5f5f2; opacity: 0; }
      #cursor { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; }
      #cursor svg { overflow: visible; filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.45)); }
    </style>
  </head>
  <body>
    <div id="logo"></div>
    <div id="ripple"></div>
    <div id="white"></div>
    <div id="cursor"><svg width="1" height="1" aria-hidden="true"><g transform="scale(2.4) rotate(-30)" fill="none" stroke-linejoin="miter" stroke-linecap="square">
      <path d="M-7.5 23.94 L0 8.94 L7.5 23.94" stroke="#0A0A0A" stroke-width="8"/><path d="M-7.5 23.94 L0 8.94 L7.5 23.94" stroke="#F5F5F2" stroke-width="5"/></g></svg></div>
    <script src="../brand/logo-animated.js"></script>
    <script>
      const W = 1920, H = 1080;
      const T = {
        speed: 1.25,           // the logo draws 1.25x the site's pace
        glide: [1870, 520],    // the cursor slides in from the bottom right
        press: [2390, 200],    // ...and presses the O
        click: 2450,           // where the click sound sits (render_intro.mjs reads it)
        ripple: [2390, 320],
        reveal: [2530, 900],   // the O opens into white
        end: 4000,
      };
      // cubic-bezier easing, as CSS does it
      function bezier(x1, y1, x2, y2) {
        const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
        const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
        const X = (t) => ((ax * t + bx) * t + cx) * t, Y = (t) => ((ay * t + by) * t + cy) * t;
        return (x) => { let t = x; for (let i = 0; i < 8; i++) { const d = (3 * ax * t + 2 * bx) * t + cx; if (Math.abs(d) < 1e-6) break; t -= (X(t) - x) / d; } return Y(Math.min(1, Math.max(0, t))); };
      }
      const EASE = bezier(0.2, 0.8, 0.2, 1), DRAW = bezier(0.65, 0, 0.35, 1), GLIDE = bezier(0.22, 1.12, 0.36, 1);
      const p = (ms, [start, dur]) => Math.min(1, Math.max(0, (ms - start) / dur));

      const holder = document.getElementById("logo");
      holder.innerHTML = AVOLogo.markup({ strokeWidth: 13 });
      const svg = holder.querySelector("svg");
      const drawing = AVOLogo.drawLogo(svg, { speed: 1, reduced: false });
      const cursor = document.getElementById("cursor"), ripple = document.getElementById("ripple"), white = document.getElementById("white");
      const box = svg.getBoundingClientRect();
      const ox = box.left + (290 / 340) * box.width, oy = box.top + box.height / 2;
      Object.assign(ripple.style, { left: ox + "px", top: oy + "px" });
      Object.assign(white.style, { left: ox + "px", top: oy + "px" });
      const far = Math.hypot(Math.max(ox, W - ox), Math.max(oy, H - oy)) + 4;

      window.T = T;
      window.render = (ms) => {
        drawing.seek(Math.min(AVOLogo.TOTAL, ms * T.speed));
        const g = GLIDE(p(ms, T.glide));
        const x = W + 40 + (ox - W - 40) * g, y = H + 40 + (oy - H - 40) * g;
        const pr = p(ms, T.press), s = pr < 0.4 ? 1 - 0.1 * (pr / 0.4) : 0.9 + 0.1 * ((pr - 0.4) / 0.6);
        cursor.style.transform = `translate(${x}px, ${y}px)`;
        cursor.firstChild.style.transform = `scale(${s})`;
        cursor.style.opacity = String(1 - EASE(p(ms, [T.reveal[0], 320])));
        const r = EASE(p(ms, T.ripple));
        ripple.style.opacity = ms < T.ripple[0] ? "0" : String(1 - r);
        ripple.style.transform = `scale(${0.3 + 1.3 * r})`;
        white.style.transform = `scale(${far * DRAW(p(ms, T.reveal))})`;
      };
      render(0);
    </script>
  </body>
</html>
