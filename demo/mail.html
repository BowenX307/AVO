<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="google" content="notranslate" /> <!-- no Chrome Translate bubble over the demo -->
    <title>Campus Mail — Inbox</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --line: #dde1e6;
        --ink: #1d232b;
        --muted: #66707c;
        --accent: #1f5fd6;
        --unread: #e9f0fd;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, sans-serif;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 22px;
        background: #fff;
        border-bottom: 1px solid var(--line);
      }
      header strong { font-size: 18px; }
      header .demo { color: var(--muted); font-size: 13px; }
      header .me { margin-left: auto; color: var(--muted); font-size: 14px; }
      main { flex: 1; display: grid; grid-template-columns: 170px 400px 1fr; min-height: 0; }
      nav { padding: 14px 10px; border-right: 1px solid var(--line); }
      nav button {
        display: flex; justify-content: space-between; width: 100%;
        padding: 8px 12px; margin-bottom: 2px;
        border: 0; border-radius: 8px; background: none;
        font: inherit; color: inherit; text-align: left; cursor: pointer;
      }
      nav button.on { background: #e3e8ef; font-weight: 600; }
      .list { border-right: 1px solid var(--line); overflow: auto; background: #fff; }
      .row {
        display: block; width: 100%;
        padding: 12px 16px;
        border: 0; border-bottom: 1px solid var(--line);
        background: #fff; text-align: left; font: inherit; color: inherit; cursor: pointer;
      }
      .row.unread { background: var(--unread); }
      .row.open { box-shadow: inset 3px 0 0 var(--accent); background: #f0f4fb; }
      .row .from { font-weight: 600; display: flex; justify-content: space-between; }
      .row .from span { font-weight: 400; color: var(--muted); font-size: 13px; }
      .row .subject { display: block; }
      .row .preview { display: block; color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .reader { padding: 26px 32px; overflow: auto; }
      .reader h1 { font-size: 21px; margin: 0 0 6px; }
      .reader .meta { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
      .reader .body { white-space: pre-wrap; max-width: 640px; }
      .empty { color: var(--muted); margin-top: 40px; }
      .actions { margin: 18px 0; display: flex; gap: 8px; }
      .btn {
        padding: 8px 18px; border-radius: 8px; border: 1px solid var(--line);
        background: #fff; font: inherit; cursor: pointer;
      }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
      .compose { margin-top: 20px; border: 1px solid var(--line); border-radius: 10px; background: #fff; max-width: 640px; }
      .compose label { display: flex; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--line); color: var(--muted); }
      .compose input { flex: 1; border: 0; font: inherit; color: var(--ink); outline: none; }
      .compose textarea {
        display: block; width: 100%; min-height: 150px;
        padding: 12px 14px; border: 0; resize: vertical; font: inherit; outline: none;
      }
      .compose .actions { margin: 0; padding: 10px 14px; border-top: 1px solid var(--line); }
      nav .new { margin-bottom: 10px; background: #1d2433; color: #fff; font-weight: 600; text-align: center; }
      .suggest, .files { margin: 0; padding: 6px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 4px; background: #fafbfc; }
      .suggest button, .files button { text-align: left; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font: inherit; cursor: pointer; }
      .suggest button small, .files button small { color: var(--muted); margin-left: 8px; }
      .files b { font-size: 12px; color: var(--muted); padding: 2px 2px 4px; }
      .att { padding: 8px 14px; border-bottom: 1px solid var(--line); color: var(--ink); }
      .att:empty { display: none; }
      .toast {
        position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
        padding: 10px 18px; border-radius: 10px; background: #1d232b; color: #fff;
        display: none;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Campus Mail</strong>
      <span class="demo">Demo · all names and messages are made up</span>
      <span class="me">Jamie Lee · jamie.lee@student.example.edu</span>
    </header>
    <main>
      <nav>
        <button class="new" id="new">New message</button>
        <button class="on" data-box="inbox">Inbox <span id="unread"></span></button>
        <button data-box="sent">Sent <span id="sent-count"></span></button>
      </nav>
      <section class="list" id="list" aria-label="Messages"></section>
      <section class="reader" id="reader"><p class="empty">Select a message to read it.</p></section>
    </main>
    <div class="toast" id="toast" role="status"></div>

    <script>
      // Two professors named Smith both wrote about today: "reply to Professor
      // Smith" doesn't say which one, so AVO should ask.
      const inbox = [
        {
          id: 10, from: "Campus IT", dept: "", email: "it-help@example.edu", time: "9:40 AM",
          subject: "Scheduled maintenance tonight", unread: true,
          body: "Campus Wi-Fi and the course portal will be unavailable tonight from 1:00 to 3:00 am while we upgrade the network.",
        },
        {
          id: 1, from: "Prof. Anna Smith", dept: "Math 241", email: "anna.smith@math.example.edu", time: "9:12 AM",
          subject: "Our 2:00 meeting today", unread: true,
          body: "Hi Jamie,\n\nJust confirming our meeting at 2:00 today in my office (Altgeld 214) to go over your project draft.\n\nBest,\nAnna Smith",
        },
        {
          id: 2, from: "Library Services", dept: "", email: "library@example.edu", time: "8:47 AM",
          subject: "Your hold is ready", unread: true,
          body: "The book you placed on hold, \"Linear Algebra Done Right\", is ready for pickup at the main desk until Friday.",
        },
        {
          id: 3, from: "Prof. David Smith", dept: "Physics 212", email: "david.smith@physics.example.edu", time: "8:05 AM",
          subject: "Lab section this afternoon", unread: true,
          body: "Hello everyone,\n\nReminder: lab section meets at 2:00 today in Loomis 141. We start the pendulum experiment right away, so please let me know if you can't be on time.\n\nDavid Smith",
        },
        {
          id: 11, from: "Maya Chen", dept: "", email: "maya.chen@student.example.edu", time: "7:52 AM",
          subject: "Groceries?", unread: false,
          body: "I'm going to the store after class. Need anything? I'm getting eggs and oat milk.",
        },
        {
          id: 4, from: "Jordan Park", dept: "", email: "jordan.park@student.example.edu", time: "Yesterday",
          subject: "Study group Thursday?", unread: false,
          body: "Hey! Are you still up for the study group on Thursday at 6? I booked a room in the library.",
        },
        {
          id: 5, from: "Career Center", dept: "", email: "careers@example.edu", time: "Yesterday",
          subject: "Resume review drop-in hours", unread: false,
          body: "Drop-in resume reviews are open this week, Monday to Thursday, 1–4 pm.",
        },
        {
          id: 12, from: "Registrar", dept: "", email: "registrar@example.edu", time: "Yesterday",
          subject: "Spring registration opens Monday", unread: false,
          body: "Your registration window opens Monday, Nov 9 at 8:00 am. Check your holds in the student portal before then.",
        },
        {
          id: 13, from: "CS 225 Course Staff", dept: "", email: "cs225@example.edu", time: "Oct 29",
          subject: "MP3 grades posted", unread: false,
          body: "Grades for MP3 are now on the course site. Regrade requests are open until next Friday.",
        },
        {
          id: 14, from: "Hiking Club", dept: "", email: "hiking@clubs.example.edu", time: "Oct 29",
          subject: "Saturday trip to Starved Rock", unread: false,
          body: "The bus leaves the Union at 8:00 am on Saturday. Bring water, lunch and good shoes. Reply if you need a spot.",
        },
        {
          id: 15, from: "Financial Aid Office", dept: "", email: "finaid@example.edu", time: "Oct 28",
          subject: "Your spring aid package", unread: false,
          body: "Your financial aid package for the spring semester is ready to review in the student portal.",
        },
        {
          id: 16, from: "Priya Patel", dept: "", email: "priya.patel@student.example.edu", time: "Oct 28",
          subject: "Notes from Tuesday", unread: false,
          body: "Here are my notes from Tuesday's lecture, in case you missed the part about eigenvalues.",
        },
        {
          id: 17, from: "Student Wellness", dept: "", email: "wellness@example.edu", time: "Oct 27",
          subject: "Free flu shots this week", unread: false,
          body: "Walk-in flu shots are free for students at McKinley Health Center, Monday to Friday, 9 am to 4 pm.",
        },
        {
          id: 18, from: "Dining Services", dept: "", email: "dining@example.edu", time: "Oct 27",
          subject: "New hours at the Union", unread: false,
          body: "Starting next week the Union food court opens at 7:00 am and stays open until 10:00 pm on weekdays.",
        },
      ];
      const sent = [];
      // The address book and the Documents folder for "New message" (all made up).
      const CONTACTS = [
        { name: "Alex Chen", team: "Design team", email: "alex.chen@design.example.edu" },
        { name: "Alex Rivera", team: "Finance", email: "alex.rivera@finance.example.edu" },
        { name: "Maya Chen", team: "Roommate", email: "maya.chen@student.example.edu" },
        { name: "Jordan Park", team: "Study group", email: "jordan.park@student.example.edu" },
      ];
      const DOCUMENTS = ["AVO project brief.pdf", "AVO budget draft.xlsx", "Lab report week 3.docx", "Resume 2026.pdf", "Hiking trip photos.zip"];
      let box = "inbox";
      let openId = null;
      const $ = (id) => document.getElementById(id);

      function name(m) {
        return m.dept ? `${m.from} (${m.dept})` : m.from;
      }

      function renderList() {
        const items = box === "inbox" ? inbox : sent;
        $("list").innerHTML = "";
        for (const m of items) {
          const row = document.createElement("button");
          row.className = "row" + (m.unread ? " unread" : "") + (m.id === openId ? " open" : "");
          row.innerHTML = `<span class="from">${box === "inbox" ? name(m) : "To: " + m.to}<span>${m.time}</span></span>
            <span class="subject">${m.subject}</span><span class="preview">${m.body.replace(/\n+/g, " ")}</span>`;
          row.onclick = () => openMessage(m.id);
          $("list").appendChild(row);
        }
        const n = inbox.filter((m) => m.unread).length;
        $("unread").textContent = n ? n : "";
        $("sent-count").textContent = sent.length ? sent.length : "";
      }

      function openMessage(id) {
        const items = box === "inbox" ? inbox : sent;
        const m = items.find((x) => x.id === id);
        openId = id;
        m.unread = false;
        renderList();
        const meta = box === "inbox" ? `From ${name(m)} &lt;${m.email}&gt; · ${m.time}` : `To ${m.to} · ${m.time}`;
        $("reader").innerHTML = `<h1>${m.subject}</h1><div class="meta">${meta}</div><div class="body"></div>`;
        $("reader").querySelector(".body").textContent = m.body + (m.attachments && m.attachments.length ? `\n\n📎 ${m.attachments.join(", ")}` : "");
        if (box === "inbox") {
          const actions = document.createElement("div");
          actions.className = "actions";
          actions.innerHTML = `<button class="btn" id="reply">Reply</button>`;
          $("reader").appendChild(actions);
          $("reply").onclick = () => compose(m);
        }
        document.title = `Campus Mail — ${m.subject}`;
      }

      function compose(m) {
        if (document.querySelector(".compose")) return document.querySelector(".compose textarea").focus();
        const c = document.createElement("form");
        c.className = "compose";
        c.innerHTML = `<label>To <input name="to" value="${m.email}" aria-label="To" /></label>
          <label>Subject <input name="subject" value="Re: ${m.subject}" aria-label="Subject" /></label>
          <textarea name="body" aria-label="Message" placeholder="Write your reply"></textarea>
          <div class="actions"><button class="btn primary" type="submit">Send</button>
          <button class="btn" type="button" id="discard">Discard</button></div>`;
        $("reader").appendChild(c);
        c.querySelector("textarea").focus();
        c.querySelector("#discard").onclick = () => c.remove();
        c.onsubmit = (e) => {
          e.preventDefault();
          const f = new FormData(c);
          const reply = {
            id: 100 + sent.length, to: f.get("to"), subject: f.get("subject"), body: f.get("body"),
            time: new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }), replyTo: m.id,
          };
          sent.unshift(reply);
          c.remove();
          toast(`Reply sent to ${m.from}`);
          document.title = `Campus Mail — Sent to ${m.from}`;
          report({ sent: sent.map(({ to, subject, body }) => ({ to, subject, body })) });
          renderList();
        };
      }

      // A new message: the To field suggests contacts as you type; Attach opens Documents.
      function newMessage() {
        openId = null;
        $("reader").innerHTML = `<h1>New message</h1>`;
        const c = document.createElement("form");
        c.className = "compose";
        c.innerHTML = `<label>To <input name="to" aria-label="To" autocomplete="off" placeholder="Name or email" /></label>
          <div class="suggest" hidden></div>
          <label>Subject <input name="subject" aria-label="Subject" /></label>
          <label class="att-row" hidden>Attached <input name="attached" aria-label="Attached" readonly /></label>
          <div class="files" hidden><b>Documents</b></div>
          <textarea name="body" aria-label="Message" placeholder="Write your message"></textarea>
          <div class="actions"><button class="btn primary" type="submit">Send</button>
          <button class="btn" type="button" id="attach">Attach</button>
          <button class="btn" type="button" id="discard">Discard</button></div>`;
        $("reader").appendChild(c);
        const to = c.querySelector('[name="to"]'), suggest = c.querySelector(".suggest"), files = c.querySelector(".files");
        const attached = [];
        to.addEventListener("input", () => {
          const q = to.value.trim().toLowerCase();
          const hits = q ? CONTACTS.filter((p) => p.name.toLowerCase().includes(q) || p.email.includes(q)) : [];
          suggest.innerHTML = "";
          suggest.hidden = !hits.length;
          for (const p of hits) {
            const b = document.createElement("button");
            b.type = "button";
            b.innerHTML = `${p.name} · ${p.team}<small>${p.email}</small>`;
            b.onclick = () => { to.value = p.email; suggest.hidden = true; };
            suggest.appendChild(b);
          }
        });
        c.querySelector("#attach").onclick = () => {
          files.innerHTML = "<b>Documents</b>";
          for (const f of DOCUMENTS) {
            const b = document.createElement("button");
            b.type = "button";
            b.textContent = f;
            b.onclick = () => {
              if (!attached.includes(f)) attached.push(f);
              c.querySelector(".att-row").hidden = false;
              c.querySelector('[name="attached"]').value = attached.join(", ");
              files.hidden = true;
            };
            files.appendChild(b);
          }
          files.hidden = false;
        };
        c.querySelector("#discard").onclick = () => ($("reader").innerHTML = `<p class="empty">Select a message to read it.</p>`);
        c.onsubmit = (e) => {
          e.preventDefault();
          const f = new FormData(c);
          const p = CONTACTS.find((x) => x.email === f.get("to"));
          const msg = {
            id: 100 + sent.length, to: f.get("to"), subject: f.get("subject") || "(no subject)", body: f.get("body"),
            attachments: [...attached], time: new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }),
          };
          sent.unshift(msg);
          $("reader").innerHTML = `<p class="empty">Message sent.</p>`;
          toast(`Sent to ${p ? p.name : msg.to}` + (attached.length ? ` with ${attached.join(", ")}` : ""));
          document.title = `Campus Mail — Sent to ${p ? p.name : msg.to}`;
          report({ sent: sent.map(({ to, subject, body, attachments }) => ({ to, subject, body, attachments })) });
          renderList();
        };
        to.focus();
        document.title = "Campus Mail — New message";
      }

      // For scripted runs (scripts/run_demo.py): the page's result, sent to the
      // harness when it serves the page; nothing is sent when opened as a file.
      function report(state) {
        document.body.dataset.state = JSON.stringify(state);
        if (location.protocol.startsWith("http")) fetch("/report", { method: "POST", body: JSON.stringify(state) }).catch(() => {});
      }

      function toast(text) {
        $("toast").textContent = text;
        $("toast").style.display = "block";
        setTimeout(() => ($("toast").style.display = "none"), 4000);
      }

      $("new").onclick = newMessage;
      document.querySelectorAll("nav button[data-box]").forEach((b) => {
        b.onclick = () => {
          document.querySelectorAll("nav button[data-box]").forEach((x) => x.classList.toggle("on", x === b));
          box = b.dataset.box;
          openId = null;
          $("reader").innerHTML = `<p class="empty">Select a message to read it.</p>`;
          renderList();
        };
      });
      renderList();
    </script>
  </body>
</html>
