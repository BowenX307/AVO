<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AVO overlay preview</title>
    <!--
      Look at the overlay's states in a browser, without Electron and without
      taking over the screen. Serve the repo root and open, e.g.:

        python3 -m http.server 8000
        http://localhost:8000/overlay/preview.html?scene=ask

      The board demo stands in for the desktop; the real overlay pages
      (index.html, island.html) run on top of it with a stand-in for main.js.
      Scenes: launch idle select planning step thinking ask ask-ok safety clarify picked paused stuck done error.
      Differences from the real thing: no native blur behind the island, and
      the island moves with a CSS transition instead of the macOS animation.
    -->
    <style>
      html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; background: #888; }
      iframe { position: absolute; border: 0; }
      #desk, #pointer { inset: 0; width: 100%; height: 100%; }
      #island { transition: left 250ms, top 250ms, width 250ms, height 250ms; }
    </style>
  </head>
  <body>
    <iframe id="desk" src="../demo/board.html"></iframe>
    <iframe id="pointer" src="index.html"></iframe>
    <iframe id="island" src="island.html"></iframe>
    <script>
      const scene = new URLSearchParams(location.search).get("scene") || "idle";
      const frames = { pointer: document.getElementById("pointer"), island: document.getElementById("island") };
      const desk = document.getElementById("desk");
      const handlers = {};
      const to = (name, msg) => handlers[name]?.(msg);
      const both = (msg) => (to("island", msg), to("pointer", msg));

      // The stand-in for main.js: where the island sits, and the answers.
      let anchor = null;
      let asking = null;
      let regions = [];
      function placeIsland({ state, width, height = 36 }) {
        const W = innerWidth, Hh = innerHeight;
        let x = (W - width) / 2, y = 8;
        if (state === "input" && anchor) {
          const [l, t, r, b] = anchor;
          x = Math.max(12, Math.min((l + r) / 2 - width / 2, W - width - 12));
          y = b + 14;
          if (y + height > Hh - 8) y = Math.max(8, t - 14 - height);
        } else if (state === "ask" && asking) {
          const { l, t, r, b } = asking;
          if (x < r + 16 && x + width > l - 16 && y < b + 16 && y + height > t - 16) {
            if (r + 16 + width <= W - 12) x = r + 16;
            else if (l - 16 - width >= 12) x = l - 16 - width;
            else (x = Math.max(12, Math.min((l + r) / 2 - width / 2, W - width - 12))), (y = b + 14);
          }
        }
        Object.assign(frames.island.style, { left: `${x}px`, top: `${y}px`, width: `${width}px`, height: `${height}px` });
      }
      function answer(a) {
        asking = null;
        to("pointer", { type: "answered", choice: a.choice, index: a.index });
        to("island", { type: "answered" });
      }
      window.avoPreview = (name) => ({
        onEvent: (h) => (handlers[name] = h),
        send(channel, data) {
          if (channel === "island-size") placeIsland(data);
          else if (channel === "select-box") {
            regions = regions.filter((r) => r.label !== data.label).concat(data);
            anchor = data.box;
            to("island", { type: "input", placeholder: regions.length > 1 ? "Tell AVO what to do with A → B" : "Tell AVO what to do with A" });
          } else if (channel === "answer") answer(data);
          else if (channel === "bubble-choice" && data.choice !== "no") answer(data);
        },
      });

      // ---- helpers for scenes ----
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      const D = () => desk.contentDocument;
      const rect = (el) => {
        const r = el.getBoundingClientRect();
        return [Math.round(r.left), Math.round(r.top), Math.round(r.right), Math.round(r.bottom)];
      };
      const find = (sel, text) => [...D().querySelectorAll(sel)].find((e) => e.textContent.includes(text));
      function dragOn(box, pad = 6) {
        const doc = frames.pointer.contentDocument;
        const ev = (type, x, y) => doc.dispatchEvent(new MouseEvent(type, { clientX: x, clientY: y, button: 0, bubbles: true }));
        ev("mousedown", box[0] - pad, box[1] - pad);
        ev("mousemove", (box[0] + box[2]) / 2, (box[1] + box[3]) / 2);
        ev("mousemove", box[2] + pad, box[3] + pad);
        ev("mouseup", box[2] + pad, box[3] + pad);
      }
      function openOwnerMenu() {
        D().querySelector('[data-id="budget"] .owner').click();
        return ["Alex Chen", "Alex Rivera"].map((name) => {
          const item = find(".menu .item", name);
          const box = rect(item);
          return { label: name, x: (box[0] + box[2]) / 2, y: (box[1] + box[3]) / 2, box };
        });
      }
      const center = (b) => [(b[0] + b[2]) / 2, (b[1] + b[3]) / 2];
      const budget = () => rect(D().querySelector('[data-id="budget"]'));
      const owner = () => rect(D().querySelector('[data-id="budget"] .owner'));
      const step = (n, total, text) => both({ type: "status", text, busy: false, step: n, total });

      const SCENES = {
        launch: async () => {},
        idle: async () => {},
        async select() {
          both({ type: "select-start" });
          to("island", { type: "guide", text: "Select A" });
          await wait(400);
          dragOn(rect(find("li", "Alex will update")));
          await wait(500);
          dragOn(budget());
        },
        async planning() {
          both({ type: "status", text: "Planning…", busy: true, phase: "planning" });
        },
        async step() {
          step(2, 4, "Assigning the budget card to the person the notes name");
          const [x, y] = center(owner());
          to("pointer", { type: "move", x, y, ms: 450 });
        },
        async thinking() {
          step(2, 0, "Opening the owner menu");
          const [x, y] = center(owner());
          to("pointer", { type: "move", x, y, ms: 450 });
          await wait(600);
          both({ type: "status", text: "Thinking…", busy: true });
        },
        async ask() {
          step(3, 0, "Picking Alex in the owner menu");
          await wait(300);
          const c = openOwnerMenu();
          c[1].guess = true;
          asking = { l: c[0].box[0], t: c[0].box[1], r: c[1].box[2] + 40, b: c[1].box[3] };
          both({ type: "confirm", id: "p1", x: c[1].x, y: c[1].y, candidates: c, intent: "The notes only say “Alex”, and two people match.", reason: "" });
        },
        async "ask-ok"() {
          step(1, 0, "Opening the owner menu on the budget card");
          const box = owner();
          const [x, y] = center(box);
          asking = { l: box[0], t: box[1], r: box[2], b: box[3] };
          both({
            type: "confirm", id: "p2", x, y, box,
            intent: "Open the owner menu on “Update Q4 budget sheet”.",
            under: "“Unassigned” owner button",
            reason: "The click lands near the edge of the button.",
          });
        },
        async safety() {
          step(5, 0, "Submitting the expense form");
          to("island", {
            type: "confirm", id: "p3", kind: "safety",
            intent: "Submitting the expense form.",
            reason: "The page asks to send payment details to an unknown site.",
          });
        },
        async countdown() {
          step(2, 0, "Opening the owner menu");
          const box = owner();
          const [x, y] = center(box);
          both({ type: "confirm", id: "p5", kind: "countdown", box, x, y, text: "Clicking “Unassigned”", seconds: 6 });
        },
        async confirm() {
          step(6, 0, "Sending the reply to Professor Smith");
          to("island", {
            type: "confirm", id: "p6", kind: "confirm", title: "Send — OK?", intent: "Clicking “Send”",
            detail: "Dear Professor Smith,\n\nI'm running about ten minutes late for lab this afternoon. Sorry for the trouble — I'll be there as soon as I can.\n\nBest,\nJamie Lee",
          });
        },
        async "ask-long"() {
          step(2, 0, "Opening the Smith email");
          await wait(300);
          const c = openOwnerMenu();
          c[0].label = "Software Engineer Intern, Systems and Infrastructure (PhD)";
          c[1].label = "Software Engineer Intern, Machine Learning (PhD)";
          c[1].guess = true;
          asking = { l: c[0].box[0], t: c[0].box[1], r: c[1].box[2] + 40, b: c[1].box[3] };
          both({ type: "confirm", id: "p7", x: c[1].x, y: c[1].y, candidates: c, intent: "Both listings match “software engineer intern”.", reason: "" });
        },
        async clarify() {
          both({ type: "status", text: "Planning…", busy: true, phase: "planning" });
          await wait(900);
          to("island", {
            type: "confirm", id: "p4", kind: "clarify",
            question: "How should I send the report to Alex?",
            options: ["Email the expense report to Alex", "Message it to Alex in chat", "Submit the form and forward the confirmation"],
          });
        },
        async picked() {
          await SCENES.ask();
          await wait(1400);
          answer({ choice: "pick", index: 1 });
        },
        async paused() {
          step(2, 0, "Opening the owner menu");
          to("island", { type: "paused", text: "You moved — paused." });
        },
        async stuck() {
          step(4, 0, "Opening Meta Careers");
          to("island", { type: "paused", text: "Stuck — pressing ⌘L changes nothing" });
        },
        async done() {
          step(4, 4, "Picking Alex Rivera");
          await wait(300);
          both({ type: "done", text: "Assigned “Update Q4 budget sheet” to Alex Rivera", ok: true });
        },
        async error() {
          step(3, 0, "Picking Alex in the owner menu");
          await wait(300);
          both({ type: "done", text: "Reached the step limit", ok: false, retry: true });
        },
      };

      addEventListener("load", async () => {
        await wait(scene === "launch" ? 0 : 3600); // let the launch animation finish first
        await SCENES[scene]?.();
        if (new URLSearchParams(location.search).has("debug")) {
          await wait(1500);
          const d = frames.island.contentDocument;
          const pre = document.createElement("pre");
          pre.id = "debug";
          pre.textContent = JSON.stringify({ frame: frames.island.style.cssText, body: d.body.className, card: d.getElementById("card").getBoundingClientRect().height, shell: getComputedStyle(d.getElementById("shell")).backgroundColor, font: d.fonts.status });
          document.body.append(pre);
        }
      });
    </script>
  </body>
</html>
