<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
    <title>AVO question</title>
    <style>
      /* The "OK to click here?" / "Which one did you mean?" card. Like the island, the window is macOS glass
         (rounded in glass.js); the page adds a white tint and the content. */
      :root { --ink: #111; --muted: rgba(0, 0, 0, 0.55); }
      html, body {
        margin: 0;
        overflow: hidden;
        user-select: none;
        -webkit-font-smoothing: antialiased;
        font: 400 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        color: var(--ink);
      }
      /* The tint sits on the card, not on html: a root background fills the whole
         window, square corners included. */
      html, body { background: transparent; }
      #card {
        width: 300px;
        box-sizing: border-box;
        padding: 16px 16px 14px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.62);
        box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.8);
      }
      .q { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
      .intent { margin-top: 3px; color: var(--muted); }
      .reason {
        display: flex;
        gap: 6px;
        margin-top: 8px;
        font-size: 12px;
        color: rgba(0, 0, 0, 0.72);
      }
      .reason::before {
        content: "!";
        flex: none;
        width: 15px;
        height: 15px;
        margin-top: 0.5px;
        border-radius: 50%;
        background: var(--ink);
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        line-height: 15px;
        text-align: center;
      }
      .under { margin-top: 6px; font-weight: 600; }
      .under::before { content: "About to click: "; font-weight: 400; color: var(--muted); }
      .note { margin-top: 10px; font-size: 11.5px; color: var(--muted); }
      .reason:empty, .intent:empty, .under:empty { display: none; }
      .loupe {
        display: block;
        width: 268px;
        height: 168px;
        margin-top: 12px;
        border-radius: 14px;
        object-fit: cover;
        box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.15);
      }
      .loupe:not([src]), body.correcting .loupe { display: none; }
      .row { display: flex; gap: 8px; margin-top: 14px; }
      button {
        flex: 1;
        height: 34px;
        border: 0;
        border-radius: 17px;
        font: 600 14px -apple-system, BlinkMacSystemFont, sans-serif;
        letter-spacing: -0.01em;
        cursor: pointer;
        transition: transform 100ms ease, background 150ms ease;
      }
      button:active { transform: scale(0.96); }
      .yes { background: var(--ink); color: #fff; }
      .yes:hover { background: #333; }
      .no { background: rgba(0, 0, 0, 0.07); color: var(--ink); }
      .no:hover { background: rgba(0, 0, 0, 0.11); }
      .stop { flex: 0 0 58px; background: transparent; color: var(--muted); font-weight: 500; }
      .stop:hover { color: var(--ink); }
      body.correcting .yes, body.correcting .no { display: none; }

      /* "Which one?": one row per candidate. */
      .choices { display: none; flex-direction: column; gap: 6px; margin-top: 12px; }
      body.picking .choices { display: flex; }
      body.picking .yes, body.picking .no, body.picking .loupe { display: none; }
      body.picking .stop { flex: 0 0 auto; padding: 0 2px; margin-left: auto; }
      .choices button {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex: none;
        height: 38px;
        padding: 0 14px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.06);
        color: var(--ink);
        text-align: left;
      }
      .choices button:hover { background: var(--ink); color: #fff; }
      .choices button i { font-style: normal; font-weight: 500; font-size: 12px; opacity: 0.55; }
      body.correcting .stop { flex: 0 0 auto; padding: 0 2px; margin-left: auto; }
    </style>
  </head>
  <body>
    <div id="card">
      <div class="q"></div>
      <div class="intent"></div>
      <div class="under"></div>
      <div class="reason"></div>
      <img class="loupe" alt="" />
      <div class="choices"></div>
      <div class="row">
        <button class="stop">Stop</button>
        <button class="no">No</button>
        <button class="yes">Yes</button>
      </div>
      <div class="note"></div>
    </div>
    <script>
      const card = document.getElementById("card");
      const $ = (s) => document.querySelector(s);

      function report() {
        requestAnimationFrame(() => {
          const r = card.getBoundingClientRect();
          window.avo.send("bubble-size", { width: r.width, height: r.height });
        });
      }

      window.avo.onEvent((m) => {
        if (m.type !== "confirm") return;
        document.body.classList.remove("correcting");
        document.body.classList.toggle("picking", !!m.candidates);
        $(".choices").replaceChildren(
          ...(m.candidates || []).map((c, i) => {
            const b = document.createElement("button");
            b.textContent = c.label;
            if (c.guess) b.insertAdjacentHTML("beforeend", "<i>AVO's guess</i>");
            b.addEventListener("click", () => window.avo.send("bubble-choice", { choice: "pick", index: i }));
            return b;
          }),
        );
        $(".q").textContent = m.candidates ? "Which one did you mean?" : "OK to click here?";
        $(".intent").textContent = m.intent || "";
        $(".under").textContent = m.candidates ? "" : m.under || "";
        $(".reason").textContent = m.reason || "";
        $(".note").textContent = m.candidates
          ? "Or click the right one on screen."
          : "Yes lets AVO go ahead. No: then click the right spot yourself.";
        if (m.loupe) $(".loupe").src = m.loupe;
        else $(".loupe").removeAttribute("src");
        report();
      });

      $(".yes").addEventListener("click", () => window.avo.send("bubble-choice", { choice: "yes" }));
      $(".stop").addEventListener("click", () => window.avo.send("bubble-choice", { choice: "stop" }));
      $(".no").addEventListener("click", () => {
        document.body.classList.add("correcting");
        $(".q").textContent = "Click the right spot";
        $(".intent").textContent = "AVO will click where you click.";
        $(".under").textContent = "";
        $(".reason").textContent = "";
        $(".note").textContent = "";
        window.avo.send("bubble-choice", { choice: "no" });
        report();
      });
    </script>
  </body>
</html>
