<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
    <title>AVO pointer</title>
    <style>
      :root {
        --glide: 450ms;
        --glass: rgba(255, 255, 255, 0.82);
        --glass-edge: rgba(255, 255, 255, 0.95);
        --hairline: rgba(0, 0, 0, 0.2);
        --ink: rgba(0, 0, 0, 0.82);
        --shadow: 0 6px 18px rgba(0, 0, 0, 0.18), 0 1px 3px rgba(0, 0, 0, 0.12);
      }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        pointer-events: none;
        user-select: none;
        -webkit-font-smoothing: antialiased;
        font: 500 13px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      }

      /* ---- agent pointer: an iPadOS-style glass disc ---- */
      #cursor {
        position: absolute;
        left: 0;
        top: 0;
        opacity: 0;
        transform: translate(-100px, -100px);
        transition: transform var(--glide) cubic-bezier(0.22, 1, 0.36, 1), opacity 250ms ease;
        z-index: 3;
      }
      #cursor.on { opacity: 1; }
      .disc {
        position: absolute;
        width: 28px;
        height: 28px;
        margin: -14px 0 0 -14px;
        border-radius: 50%;
        background:
          radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.98), rgba(255, 255, 255, 0) 55%),
          rgba(255, 255, 255, 0.55);
        border: 1px solid var(--glass-edge);
        box-shadow: 0 0 0 1px var(--hairline), 0 4px 14px rgba(0, 0, 0, 0.3),
          inset 0 -3px 6px rgba(0, 0, 0, 0.1);
        transition: transform 140ms ease;
      }
      .disc::after { /* exact hot spot */
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 4px;
        height: 4px;
        margin: -2px 0 0 -2px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.45);
      }
      #cursor.press .disc { transform: scale(0.72); }
      .glass {
        position: absolute;
        background: var(--glass);
        border: 0.5px solid var(--glass-edge);
        box-shadow: 0 0 0 0.5px var(--hairline), var(--shadow);
        color: var(--ink);
        white-space: nowrap;
      }
      .tag {
        left: 16px;
        top: 12px;
        padding: 2px 8px;
        border-radius: 9px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: rgba(0, 0, 0, 0.55);
      }
      .chip {
        left: 16px;
        top: 38px;
        max-width: 360px;
        padding: 6px 12px;
        border-radius: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        opacity: 0;
        transform: translateY(-4px) scale(0.96);
        transform-origin: top left;
        transition: opacity 180ms ease, transform 180ms ease;
      }
      .chip.on { opacity: 1; transform: none; }

      /* ---- click ripple ---- */
      .ripple {
        position: absolute;
        width: 40px;
        height: 40px;
        margin: -20px 0 0 -20px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.95);
        box-shadow: 0 0 0 0.5px var(--hairline), 0 2px 8px rgba(0, 0, 0, 0.15);
        animation: ripple 550ms ease-out forwards;
        z-index: 2;
      }
      @keyframes ripple {
        from { transform: scale(0.4); opacity: 1; }
        to { transform: scale(1.5); opacity: 0; }
      }

      /* ---- "是这个吗？": spotlight on the target + glass question bubble ---- */
      body.asking { pointer-events: auto; }
      body.correcting { cursor: crosshair; }
      #spot {
        position: absolute;
        border-radius: 12px;
        box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.26), 0 0 0 2px rgba(255, 255, 255, 0.95),
          0 0 22px 4px rgba(255, 255, 255, 0.55);
        opacity: 0;
        transition: opacity 220ms ease, left 300ms ease, top 300ms ease, width 300ms ease, height 300ms ease;
        animation: breathe 1.6s ease-in-out infinite;
        z-index: 1;
      }
      #spot.on { opacity: 1; }
      body.correcting #spot { box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.12), 0 0 0 2px rgba(255, 255, 255, 0.6); animation: none; }
      @keyframes breathe {
        50% { box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.26), 0 0 0 2px rgba(255, 255, 255, 0.95),
          0 0 30px 8px rgba(255, 255, 255, 0.75); }
      }
      #bubble {
        position: absolute;
        width: 300px;
        padding: 14px 16px 12px;
        border-radius: 18px;
        background: rgba(250, 250, 252, 0.97);
        border: 0.5px solid var(--glass-edge);
        box-shadow: 0 0 0 0.5px var(--hairline), 0 12px 32px rgba(0, 0, 0, 0.22), 0 2px 6px rgba(0, 0, 0, 0.12);
        color: var(--ink);
        opacity: 0;
        transform: translateY(6px) scale(0.97);
        transition: opacity 200ms ease, transform 200ms ease;
        pointer-events: none;
        z-index: 4;
      }
      #bubble.on { opacity: 1; transform: none; pointer-events: auto; }
      #bubble .q { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
      #bubble .intent { margin-top: 4px; font-size: 13px; color: rgba(0, 0, 0, 0.7); }
      #bubble .reason { margin-top: 6px; font-size: 12px; color: #b25000; }
      #bubble .reason:empty, #bubble .intent:empty { display: none; }
      #bubble .loupe {
        display: block;
        width: 268px;
        height: 168px;
        margin-top: 10px;
        border-radius: 12px;
        box-shadow: 0 0 0 0.5px var(--hairline), inset 0 0 0 0.5px rgba(0, 0, 0, 0.1);
        object-fit: cover;
      }
      #bubble .loupe:not([src]), body.correcting #bubble .loupe { display: none; }
      #bubble .row { display: flex; gap: 8px; margin-top: 12px; }
      #bubble button {
        flex: 1;
        height: 34px;
        border: 0;
        border-radius: 10px;
        font: 600 14px -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        cursor: pointer;
      }
      #bubble .yes { background: #0a84ff; color: #fff; }
      #bubble .no { background: rgba(120, 120, 128, 0.16); color: var(--ink); }
      #bubble .stop { flex: 0 0 64px; background: transparent; color: #ff3b30; }
      #bubble button:active { transform: scale(0.97); }
      body.correcting #bubble .yes, body.correcting #bubble .no { display: none; }
    </style>
  </head>
  <body>
    <div id="cursor">
      <span class="disc"></span>
      <span class="glass tag">AVO</span>
      <span class="glass chip"></span>
    </div>

    <div id="spot"></div>
    <div id="bubble">
      <div class="q"></div>
      <div class="intent"></div>
      <div class="reason"></div>
      <img class="loupe" alt="" />
      <div class="row">
        <button class="stop">停止</button>
        <button class="no">不是</button>
        <button class="yes">是</button>
      </div>
    </div>

    <script>
      const cursor = document.getElementById("cursor");
      const chip = cursor.querySelector(".chip");

      let pos = null;
      let chipTimer = null;
      let hideTimer = null;

      const KEY_GLYPHS = {
        cmd: "⌘", command: "⌘", meta: "⌘", super: "⌘",
        ctrl: "⌃", control: "⌃", alt: "⌥", option: "⌥", shift: "⇧",
        enter: "↩", return: "↩", tab: "⇥", esc: "esc", escape: "esc",
        backspace: "⌫", delete: "⌦", space: "space",
        up: "↑", down: "↓", left: "←", right: "→",
        arrowup: "↑", arrowdown: "↓", arrowleft: "←", arrowright: "→",
      };

      function moveTo(x, y, ms = 450) {
        clearTimeout(hideTimer);
        if (!pos) {
          // First appearance: start from screen centre so the glide is visible.
          cursor.style.transition = "none";
          cursor.style.transform = `translate(${innerWidth / 2}px, ${innerHeight / 2}px)`;
          cursor.getBoundingClientRect(); // commit the start position
          cursor.style.transition = "";
        }
        cursor.style.setProperty("--glide", `${ms}ms`);
        cursor.classList.add("on");
        cursor.style.transform = `translate(${x}px, ${y}px)`;
        pos = { x, y };
      }

      function press() {
        cursor.classList.add("press");
        setTimeout(() => cursor.classList.remove("press"), 140);
      }

      function ripple(x, y) {
        const r = document.createElement("div");
        r.className = "ripple";
        r.style.left = `${x}px`;
        r.style.top = `${y}px`;
        document.body.appendChild(r);
        r.addEventListener("animationend", () => r.remove());
      }

      function showChip(text, ms = 1600) {
        chip.textContent = text;
        chip.classList.add("on");
        clearTimeout(chipTimer);
        chipTimer = setTimeout(() => chip.classList.remove("on"), ms);
      }

      function hideCursor() {
        cursor.classList.remove("on");
        chip.classList.remove("on");
        pos = null;
      }

      // ---- confirm ("是这个吗？") ----
      const spot = document.getElementById("spot");
      const bubble = document.getElementById("bubble");
      let asking = null; // the confirm request being answered

      function placeSpot(m) {
        const pad = 6;
        let [l, t, r, b] = m.box || [m.x - 28, m.y - 18, m.x + 28, m.y + 18];
        l -= pad; t -= pad; r += pad; b += pad;
        Object.assign(spot.style, { left: `${l}px`, top: `${t}px`, width: `${r - l}px`, height: `${b - t}px` });
        spot.classList.add("on");
        return { l, t, r, b };
      }

      function placeBubble(rect) {
        const w = 300, h = bubble.offsetHeight || 340, gap = 14;
        let left = (rect.l + rect.r) / 2 - w / 2;
        left = Math.max(12, Math.min(left, innerWidth - w - 12));
        let top = rect.b + gap;
        if (top + h > innerHeight - 100) top = Math.max(12, rect.t - gap - h); // flip above near the Dock
        Object.assign(bubble.style, { left: `${left}px`, top: `${top}px` });
      }

      function ask(m) {
        asking = m;
        document.body.classList.add("asking");
        document.body.classList.remove("correcting");
        bubble.querySelector(".q").textContent = "是这个吗？";
        bubble.querySelector(".intent").textContent = m.intent || "";
        bubble.querySelector(".reason").textContent = m.reason ? `⚠︎ ${m.reason}` : "";
        const lens = bubble.querySelector(".loupe");
        if (m.loupe) lens.src = m.loupe;
        else lens.removeAttribute("src");
        moveTo(m.x, m.y, 450);
        const rect = placeSpot(m);
        bubble.classList.add("on");
        placeBubble(rect);
      }

      function finish(answer) {
        if (!asking) return;
        window.avo.send("answer", { id: asking.id, ...answer });
        asking = null;
        document.body.classList.remove("asking", "correcting");
        spot.classList.remove("on");
        bubble.classList.remove("on");
      }

      bubble.querySelector(".yes").addEventListener("click", () => finish({ choice: "yes" }));
      bubble.querySelector(".stop").addEventListener("click", () => finish({ choice: "stop" }));
      bubble.querySelector(".no").addEventListener("click", () => {
        document.body.classList.add("correcting");
        bubble.querySelector(".q").textContent = "请直接点击正确的位置";
        bubble.querySelector(".intent").textContent = "AVO 会改点你点的地方";
        bubble.querySelector(".reason").textContent = "";
      });
      document.addEventListener("click", (e) => {
        if (!asking || !document.body.classList.contains("correcting") || bubble.contains(e.target)) return;
        ripple(e.clientX, e.clientY);
        moveTo(e.clientX, e.clientY, 200);
        finish({ choice: "no", x: e.clientX, y: e.clientY });
      });

      window.avo.onEvent((m) => {
        switch (m.type) {
          case "confirm":
            ask(m);
            break;
          case "move":
            moveTo(m.x, m.y, m.ms);
            break;
          case "click":
            moveTo(m.x, m.y, 0);
            press();
            ripple(m.x, m.y);
            if (m.button && m.button !== "left") showChip(m.button === "double" ? "双击" : `${m.button} click`);
            break;
          case "keys":
            showChip(m.keys.map((k) => KEY_GLYPHS[k.toLowerCase()] || k.toUpperCase()).join(" "));
            break;
          case "type":
            showChip(`输入：${m.text}`, 2200);
            break;
          case "scroll":
            showChip(m.dy > 0 ? "向下滚动" : "向上滚动");
            break;
          case "done":
            hideTimer = setTimeout(hideCursor, m.ms ?? 5000);
            break;
          case "hide":
            hideCursor();
            break;
        }
      });
    </script>
  </body>
</html>
