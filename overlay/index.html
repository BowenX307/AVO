<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
    <title>AVO pointer</title>
    <link rel="stylesheet" href="../brand/tokens.css" />
    <style>
      /* Black, white and grey only. The agent's pointer is the Λ of the logo
         turned into an open arrow: off-white with a black rim, so it reads on
         dark and light screens alike. Rings around targets are drawn like the
         logo's O: one stroke, a little past closed, then settled back. */
      :root {
        --glide: 300ms;
        --spring: var(--avo-ease);
        --shadow: 0 6px 16px rgba(0, 0, 0, 0.22), 0 1px 3px rgba(0, 0, 0, 0.18);
        --edge: drop-shadow(0 0 0.6px var(--avo-ink)) drop-shadow(0 0 0.6px var(--avo-ink)); /* a 1px black outline for thin white lines */
      }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        pointer-events: none;
        user-select: none;
        -webkit-font-smoothing: antialiased;
        font: 500 12px/1.3 var(--avo-font-sans);
      }

      /* ---- the AVO cursor ---- */
      #cursor {
        position: absolute;
        left: 0;
        top: 0;
        opacity: 0;
        transform: translate(-100px, -100px);
        transition: transform var(--glide) var(--spring), opacity var(--avo-dur) var(--avo-ease);
        z-index: 3;
      }
      #cursor.on { opacity: 1; }
      #cursor, #cursor * { pointer-events: none; } /* it often sits right on a ring the user wants to click */
      .arrow {
        position: absolute;
        left: 0;
        top: 0;
        width: 1px;
        height: 1px;
        overflow: visible;
        transform-origin: 0 0; /* the tip is the point */
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.32));
      }
      #cursor.press .arrow { animation: press 200ms var(--avo-ease); }
      @keyframes press { 40% { transform: scale(0.9); } }

      /* Thinking: a small ring beside the tip, drawn like the logo's O, turning slowly. */
      .think {
        position: absolute;
        left: 17px;
        top: -9px;
        width: 14px;
        height: 14px;
        overflow: visible;
        opacity: 0;
        transform: scale(0.6);
        transition: opacity var(--avo-dur) var(--avo-ease), transform var(--avo-dur) var(--avo-ease);
        filter: var(--edge);
      }
      #cursor.thinking .think { opacity: 1; transform: none; }
      .think circle { animation: turn 1.6s linear infinite; transform-origin: 7px 7px; }
      @keyframes turn { to { transform: rotate(360deg); } }

      .tag, .chip {
        position: absolute;
        left: 16px;
        background: var(--avo-glass);
        color: var(--avo-paper);
        box-shadow: var(--shadow), inset 0 0 0 1px var(--avo-glass-border);
        white-space: nowrap;
        -webkit-backdrop-filter: blur(var(--avo-blur));
        backdrop-filter: blur(var(--avo-blur));
      }
      .tag {
        top: 27px;
        padding: 3px 7px;
        border-radius: var(--avo-radius-pill);
        font: 600 9.5px/1.2 var(--avo-font-mono);
        letter-spacing: 0.14em;
      }
      .chip {
        top: 50px;
        max-width: 360px;
        padding: 6px 11px;
        border-radius: 10px;
        font-size: 12.5px;
        overflow: hidden;
        text-overflow: ellipsis;
        opacity: 0;
        transform: translateY(-4px);
        transition: opacity var(--avo-dur-fast) var(--avo-ease), transform var(--avo-dur-fast) var(--avo-ease);
      }
      .chip.on { opacity: 1; transform: none; }
      .chip.keys { font-family: var(--avo-font-mono); letter-spacing: 0.04em; }

      .ripple {
        position: absolute;
        width: 34px;
        height: 34px;
        margin: -17px 0 0 -17px;
        border-radius: 50%;
        border: 1px solid var(--avo-paper);
        filter: var(--edge);
        animation: ripple 200ms var(--avo-ease) forwards;
        z-index: 2;
      }
      @keyframes ripple {
        from { transform: scale(0.3); opacity: 1; }
        to { transform: scale(1.5); opacity: 0; }
      }

      /* One dim layer for both asking and selecting; rings and selections are
         holes cut into it (an SVG mask), so several of them never stack darker. */
      #dim { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity var(--avo-dur) var(--avo-ease); z-index: 1; }
      #dim.on { opacity: 1; }
      #dim .shade { fill: rgba(10, 10, 10, 0.36); transition: fill var(--avo-dur) var(--avo-ease); }
      body.selecting #dim .shade { fill: rgba(10, 10, 10, 0.2); }
      body.correcting #dim .shade { fill: rgba(10, 10, 10, 0.14); }

      /* ---- asking: ring the target, or every candidate ---- */
      body.asking, body.selecting { pointer-events: auto; }
      body.asking .tag { opacity: 0; }
      body.correcting, body.selecting { cursor: crosshair; }
      .ring { position: absolute; z-index: 2; }
      .ring svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.35)); }
      .ring .under { stroke: var(--avo-ink); stroke-width: 4; opacity: 0.55; }
      .ring .over { stroke: var(--avo-paper); stroke-width: 2; transition: stroke-width var(--avo-dur-fast) var(--avo-ease); }
      .ring { transition: opacity var(--avo-dur-fast) var(--avo-ease); }
      body.picking .ring { cursor: pointer; }
      body.picking .ring:hover .over { stroke-width: 3; }
      body.correcting .ring { opacity: 0.45; }
      .ring.chosen .over { stroke-width: 4; }
      .ring.gone { opacity: 0; }
      .num {
        position: absolute;
        left: calc(100% + 10px);
        top: 50%;
        min-width: 22px;
        height: 22px;
        padding: 0 6px;
        box-sizing: border-box;
        border-radius: var(--avo-radius-pill);
        transform: translateY(-50%);
        display: grid;
        place-items: center;
        font: 600 12px/1 var(--avo-font-mono);
        background: var(--avo-glass);
        color: var(--avo-paper);
        box-shadow: var(--shadow), inset 0 0 0 1px var(--avo-glass-border);
        -webkit-backdrop-filter: blur(var(--avo-blur));
        backdrop-filter: blur(var(--avo-blur));
        opacity: 0;
        animation: fade var(--avo-dur) var(--avo-ease) forwards;
      }
      .num.guess { background: var(--avo-paper); color: var(--avo-ink); box-shadow: var(--shadow), 0 0 0 1px var(--avo-ink); }
      @keyframes fade { to { opacity: 1; } }

      /* ---- box selection: viewfinder corners, not a full rectangle ---- */
      .sel { position: absolute; z-index: 2; transition: opacity var(--avo-dur) var(--avo-ease); }
      .sel .c {
        position: absolute;
        width: var(--arm, 18px);
        height: var(--arm, 18px);
        border: 0 solid var(--avo-paper);
        filter: var(--edge);
      }
      .sel .tl { left: -1px; top: -1px; border-width: 2px 0 0 2px; border-top-left-radius: 3px; }
      .sel .tr { right: -1px; top: -1px; border-width: 2px 2px 0 0; border-top-right-radius: 3px; }
      .sel .bl { left: -1px; bottom: -1px; border-width: 0 0 2px 2px; border-bottom-left-radius: 3px; }
      .sel .br { right: -1px; bottom: -1px; border-width: 0 2px 2px 0; border-bottom-right-radius: 3px; }
      .sel.faint { opacity: 0.5; }
      .sel .label {
        position: absolute;
        left: -1px;
        bottom: calc(100% + 7px);
        min-width: 22px;
        height: 22px;
        padding: 0 8px;
        box-sizing: border-box;
        display: grid;
        place-items: center;
        border-radius: var(--avo-radius-pill);
        background: var(--avo-glass);
        color: var(--avo-paper);
        font: 600 12px/1 var(--avo-font-mono);
        box-shadow: var(--shadow), inset 0 0 0 1px var(--avo-glass-border);
        -webkit-backdrop-filter: blur(var(--avo-blur));
        backdrop-filter: blur(var(--avo-blur));
      }
      .sel img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border-radius: 4px;
        opacity: 0;
        transition: opacity 400ms var(--avo-ease);
      }
      .sel img.on { opacity: 1; }

      /* Reduce motion: no glides, draws or spins; things fade in and out. */
      @media (prefers-reduced-motion: reduce) {
        #cursor { transition: opacity var(--avo-dur) var(--avo-ease); }
        #cursor.press .arrow, .think circle { animation: none; }
        .ripple { animation: fade-out var(--avo-dur) var(--avo-ease) forwards; transform: none; }
        @keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }
      }
    </style>
  </head>
  <body>
    <div id="cursor">
      <!-- The logo's Λ, as a thick open stroke: black rim (8) under off-white (5).
           The rim's miter tip is at (0, 0), the point; turned 30° counter-clockwise. -->
      <svg class="arrow" aria-hidden="true">
        <g transform="rotate(-30)" fill="none" stroke-linejoin="miter" stroke-linecap="square">
          <path d="M-7.5 23.94 L0 8.94 L7.5 23.94" stroke="#0A0A0A" stroke-width="8" />
          <path d="M-7.5 23.94 L0 8.94 L7.5 23.94" stroke="#F5F5F2" stroke-width="5" />
        </g>
      </svg>
      <svg class="think" viewBox="0 0 14 14" aria-hidden="true">
        <circle cx="7" cy="7" r="5" fill="none" stroke="#F5F5F2" stroke-width="1.6" stroke-linecap="square" stroke-dasharray="22 9.4" />
      </svg>
      <span class="tag">AVO</span>
      <span class="chip"></span>
    </div>
    <svg id="dim" aria-hidden="true">
      <defs><mask id="holes"><rect width="100%" height="100%" fill="#fff" /><g id="hole-list"></g></mask></defs>
      <rect class="shade" width="100%" height="100%" mask="url(#holes)" />
    </svg>
    <div id="marks"></div>

    <script>
      if (!window.avo) window.avo = parent.avoPreview?.("pointer"); // overlay/preview.html, outside Electron
      const cursor = document.getElementById("cursor");
      const chip = cursor.querySelector(".chip");
      const dim = document.getElementById("dim");
      const holeList = document.getElementById("hole-list");
      const marks = document.getElementById("marks"); // rings and selections
      const SVG = "http://www.w3.org/2000/svg";
      const EASE_DRAW = "cubic-bezier(0.65, 0, 0.35, 1)"; // --avo-ease-draw
      const EASE = "cubic-bezier(0.2, 0.8, 0.2, 1)"; // --avo-ease
      const reduced = matchMedia("(prefers-reduced-motion: reduce)");

      let pos = null;
      let chipTimer = null;
      let hideTimer = null;
      let asking = false;

      const KEY_GLYPHS = {
        cmd: "⌘", command: "⌘", meta: "⌘", super: "⌘",
        ctrl: "⌃", control: "⌃", alt: "⌥", option: "⌥", shift: "⇧",
        enter: "↩", return: "↩", tab: "⇥", esc: "esc", escape: "esc",
        backspace: "⌫", delete: "⌦", space: "space",
        up: "↑", down: "↓", left: "←", right: "→",
        arrowup: "↑", arrowdown: "↓", arrowleft: "←", arrowright: "→",
      };

      // A lightly damped spring as a CSS easing: it overshoots by ~2% and settles.
      const SPRING = (() => {
        const zeta = 0.72, w = 9.5;
        const wd = w * Math.sqrt(1 - zeta * zeta);
        const x = (t) => 1 - Math.exp(-zeta * w * t) * (Math.cos(wd * t) + ((zeta * w) / wd) * Math.sin(wd * t));
        const stops = Array.from({ length: 33 }, (_, i) => x(i / 32).toFixed(4));
        stops[32] = "1";
        return `linear(${stops.join(", ")})`;
      })();
      document.documentElement.style.setProperty("--spring", SPRING);

      // Glide to (x, y). Long trips take 300-440 ms by distance (always within
      // the agent's own `ms`, which it waits before clicking); short hops
      // (drag segments) use the time they're given.
      function moveTo(x, y, ms = 450) {
        clearTimeout(hideTimer);
        if (!pos) {
          // First appearance: start from screen centre so the glide is visible.
          cursor.style.transition = "none";
          cursor.style.transform = `translate(${innerWidth / 2}px, ${innerHeight / 2}px)`;
          cursor.getBoundingClientRect(); // commit the start position
          cursor.style.transition = "";
          pos = { x: innerWidth / 2, y: innerHeight / 2 };
        }
        const dist = Math.hypot(x - pos.x, y - pos.y);
        const glide = ms >= 300 ? Math.min(ms, Math.max(300, Math.min(440, 300 + dist * 0.2))) : ms;
        cursor.style.setProperty("--glide", `${glide}ms`);
        cursor.style.setProperty("--spring", ms >= 300 ? SPRING : "cubic-bezier(0.2, 0.8, 0.2, 1)");
        cursor.classList.add("on");
        cursor.style.transform = `translate(${x}px, ${y}px)`;
        pos = { x, y };
      }

      function press() {
        cursor.classList.remove("press");
        cursor.getBoundingClientRect(); // restart the animation
        cursor.classList.add("press");
      }

      function ripple(x, y) {
        const r = document.createElement("div");
        r.className = "ripple";
        r.style.left = `${x}px`;
        r.style.top = `${y}px`;
        document.body.appendChild(r);
        r.addEventListener("animationend", () => r.remove());
      }

      function showChip(text, ms = 1600, keys = false) {
        chip.textContent = text;
        chip.classList.toggle("keys", keys);
        chip.classList.add("on");
        clearTimeout(chipTimer);
        chipTimer = setTimeout(() => chip.classList.remove("on"), ms);
      }

      function hideCursor() {
        cursor.classList.remove("on", "thinking");
        chip.classList.remove("on");
        pos = null;
      }

      // ---- dim layer with holes ----
      function setHoles(boxes) {
        holeList.replaceChildren(
          ...boxes.map(([l, t, r, b]) => {
            const h = document.createElementNS(SVG, "rect");
            const rx = Math.min(12, (r - l) / 2, (b - t) / 2);
            for (const [k, v] of Object.entries({ x: l, y: t, width: r - l, height: b - t, rx, fill: "#000" })) h.setAttribute(k, v);
            return h;
          }),
        );
      }

      function place(el, [l, t, r, b]) {
        Object.assign(el.style, { left: `${l}px`, top: `${t}px`, width: `${r - l}px`, height: `${b - t}px` });
      }

      // ---- rings, drawn like the logo's O ----
      // A rounded rectangle w x h, starting at "half past ten" (the middle of
      // the top-left corner) and going clockwise, plus a short overshoot that
      // runs on over its own start, along the corner and the top edge.
      function ringPath(w, h) {
        const r = Math.min(12, w / 2, h / 2);
        const k = r * (1 - Math.SQRT1_2);
        const over = Math.min(0.04 * 2 * (w + h), w - 2 * r + r);
        const f = (n) => n.toFixed(1);
        return (
          `M${f(k)} ${f(k)} A${r} ${r} 0 0 1 ${f(r)} 0 H${f(w - r)} A${r} ${r} 0 0 1 ${f(w)} ${f(r)} ` +
          `V${f(h - r)} A${r} ${r} 0 0 1 ${f(w - r)} ${f(h)} H${f(r)} A${r} ${r} 0 0 1 0 ${f(h - r)} ` +
          `V${f(r)} A${r} ${r} 0 0 1 ${f(k)} ${f(k)} A${r} ${r} 0 0 1 ${f(r)} 0 H${f(Math.min(r + over * 0.7, w - r))}`
        );
      }

      function drawRing(svg, w, h, delay) {
        const closed = 2 * (w + h) - (8 - 2 * Math.PI) * Math.min(12, w / 2, h / 2);
        for (const p of svg.querySelectorAll("path")) {
          p.setAttribute("d", ringPath(w, h));
          if (reduced.matches) continue;
          const total = p.getTotalLength();
          p.style.strokeDasharray = `${total} ${total + 2}`;
          p.animate(
            [
              { strokeDashoffset: total + 1, easing: EASE_DRAW },
              { strokeDashoffset: 0, offset: 0.86, easing: EASE },
              { strokeDashoffset: total - closed },
            ],
            { duration: 720, delay, fill: "both" },
          );
        }
        if (reduced.matches) {
          svg.querySelectorAll("path").forEach((p) => (p.style.strokeDasharray = `${closed} 9999`));
          svg.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 280, delay, fill: "both" });
        }
      }

      function makeRing(box, n, guess) {
        const el = document.createElement("div");
        el.className = "ring";
        place(el, box);
        const svg = document.createElementNS(SVG, "svg");
        svg.setAttribute("fill", "none");
        svg.setAttribute("stroke-linecap", "square");
        svg.innerHTML = `<path class="under"/><path class="over"/>`;
        el.appendChild(svg);
        if (n) {
          const tag = document.createElement("span");
          tag.className = "num" + (guess ? " guess" : "");
          tag.textContent = n;
          el.appendChild(tag);
        }
        marks.appendChild(el);
        return el;
      }

      // ---- asking: ring the target, or every candidate of an ambiguous click ----
      let rings = [];

      function ask(m) {
        asking = true;
        document.body.classList.add("asking");
        document.body.classList.remove("correcting");
        document.body.classList.toggle("picking", !!m.candidates);
        clearRings();
        const pad = 6;
        const grow = ([l, t, r, b]) => [l - pad, t - pad, r + pad, b + pad];
        const targets = m.candidates
          ? m.candidates.map((c, i) => ({ box: grow(c.box), n: String(i + 1), guess: c.guess }))
          : [{ box: grow(m.box || [m.x - 28, m.y - 18, m.x + 28, m.y + 18]) }];
        rings = targets.map((t, i) => {
          const ring = makeRing(t.box, t.n, t.guess);
          const [l, tp, r, b] = t.box;
          drawRing(ring.querySelector("svg"), r - l, b - tp, 140 * i); // one after another
          ring.querySelector(".num")?.style.setProperty("animation-delay", `${140 * i + 520}ms`);
          ring.addEventListener("click", (e) => {
            if (document.body.classList.contains("correcting")) return;
            e.stopPropagation(); // a ring answers directly: this candidate, or "yes, that one"
            reply(m.candidates ? { choice: "pick", index: i } : { choice: "yes" });
          });
          return ring;
        });
        setHoles(targets.map((t) => t.box));
        dim.classList.add("on");
        moveTo(m.x, m.y, 450);
      }

      // Answer once; the rings stay until the overlay confirms ("answered").
      function reply(a) {
        if (!asking) return;
        asking = false;
        window.avo.send("answer", a);
      }

      function clearRings() {
        marks.querySelectorAll(".ring").forEach((r) => r.remove());
        rings = [];
      }

      // The answer is in: the chosen ring flexes, the others fade, then all go.
      function endAsk(a = {}) {
        asking = false;
        document.body.classList.remove("asking", "correcting", "picking");
        const chosen = a.choice === "pick" ? rings[a.index] : a.choice === "yes" ? rings[0] : null;
        for (const r of rings) r.classList.add(r === chosen ? "chosen" : "gone");
        const old = rings;
        rings = [];
        // The dim stays while the chosen ring flexes: a white ring on a white menu needs it.
        setTimeout(() => {
          old.forEach((r) => r.classList.add("gone"));
          if (!asking && !document.body.classList.contains("selecting")) dim.classList.remove("on");
        }, chosen ? 260 : 0);
        setTimeout(() => old.forEach((r) => r.remove()), chosen ? 600 : 360);
      }

      // While asking, a click anywhere outside the rings (and outside the card)
      // is the user pointing at the right spot themselves, with or without
      // pressing "No" first.
      document.addEventListener("click", (e) => {
        if (!asking) return;
        ripple(e.clientX, e.clientY);
        moveTo(e.clientX, e.clientY, 200);
        reply({ choice: "no", x: e.clientX, y: e.clientY });
      });

      // ---- box selection: drag A, then optionally B ----
      let regions = []; // [{label, box, el}]
      let drag = null;

      function makeSel(box, label) {
        const el = document.createElement("div");
        el.className = "sel";
        el.innerHTML = `<i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>`;
        if (label) el.insertAdjacentHTML("beforeend", `<span class="label">${label}</span>`);
        fitSel(el, box);
        marks.appendChild(el);
        return el;
      }

      function fitSel(el, box) {
        place(el, box);
        const arm = Math.max(6, Math.min(18, (box[2] - box[0]) / 3, (box[3] - box[1]) / 3));
        el.style.setProperty("--arm", `${arm}px`);
      }

      function clearRegions() {
        regions.forEach((r) => r.el.remove());
        regions = [];
      }

      function endSelect(keep) {
        document.body.classList.remove("selecting");
        drag?.el.remove();
        drag = null;
        if (!asking) dim.classList.remove("on");
        if (keep) regions.forEach((r) => r.el.classList.add("faint"));
        else clearRegions();
      }

      const dragBox = (e) => [Math.min(drag.x, e.clientX), Math.min(drag.y, e.clientY), Math.max(drag.x, e.clientX), Math.max(drag.y, e.clientY)];

      document.addEventListener("mousedown", (e) => {
        if (!document.body.classList.contains("selecting") || e.button !== 0) return;
        drag = { x: e.clientX, y: e.clientY, el: makeSel([e.clientX, e.clientY, e.clientX, e.clientY]) };
      });
      document.addEventListener("mousemove", (e) => {
        if (!drag) return;
        const box = dragBox(e);
        fitSel(drag.el, box);
        setHoles(regions.filter((r) => regions.length < 2 || r.label !== "B").map((r) => r.box).concat([box]));
      });
      document.addEventListener("mouseup", (e) => {
        if (!drag) return;
        const box = dragBox(e);
        drag.el.remove();
        drag = null;
        if (box[2] - box[0] < 8 || box[3] - box[1] < 8) {
          setHoles(regions.map((r) => r.box));
          return; // a click, not a drag
        }
        if (regions.length === 2) regions.pop().el.remove(); // a third drag redoes B
        const label = regions.length ? "B" : "A";
        const el = makeSel(box, label);
        if (!reduced.matches) el.animate([{ transform: "scale(1)" }, { transform: "scale(0.98)" }, { transform: "scale(1)" }], { duration: 280, easing: EASE }); // the corners bite
        regions.push({ label, box, el });
        setHoles(regions.map((r) => r.box));
        window.avo.send("select-box", { label, box });
      });

      // The agent's reading of each selection: SAM's mask, faded in over the box.
      function showRegionMasks(list) {
        for (const r of list) {
          const sel = regions.find((x) => x.label === r.label);
          if (!sel || !r.mask) continue;
          const img = new Image();
          img.src = r.mask;
          sel.el.appendChild(img);
          requestAnimationFrame(() => img.classList.add("on"));
          setTimeout(() => img.classList.remove("on"), 2600);
        }
      }

      window.avo.onEvent((m) => {
        switch (m.type) {
          case "confirm":
            cursor.classList.remove("thinking");
            ask(m);
            break;
          case "select-start":
            clearRegions();
            setHoles([]);
            document.body.classList.add("selecting");
            dim.classList.add("on");
            break;
          case "select-end":
            endSelect(m.keep);
            break;
          case "regions":
            showRegionMasks(m.regions || []);
            break;
          case "correct":
            document.body.classList.add("correcting");
            break;
          case "answered":
          case "cancel":
            endAsk(m);
            break;
          case "status": // a small turning ring by the tip while the model thinks
            cursor.classList.toggle("thinking", !!m.busy && /^(Thinking|Planning|Checking)/.test(m.text || ""));
            break;
          case "move":
            moveTo(m.x, m.y, m.ms);
            break;
          case "click":
            cursor.classList.remove("thinking");
            moveTo(m.x, m.y, 0);
            press();
            ripple(m.x, m.y);
            if (m.button && m.button !== "left") showChip(m.button === "double" ? "Double-click" : `${m.button} click`);
            break;
          case "snap":
            showChip(m.label ? `Snapped to “${m.label}”` : "Snapped to the nearest control", 1400);
            break;
          case "keys":
            showChip(m.keys.map((k) => KEY_GLYPHS[k.toLowerCase()] || k.toUpperCase()).join(" "), 1600, true);
            break;
          case "type":
            showChip(`Typing “${m.text}”`, 2200);
            break;
          case "scroll":
            showChip(m.dy > 0 ? "Scroll down" : "Scroll up");
            break;
          case "done":
            cursor.classList.remove("thinking");
            hideTimer = setTimeout(hideCursor, m.ms ?? 5000);
            endSelect(false);
            break;
          case "hide":
            hideCursor();
            break;
        }
      });
    </script>
  </body>
</html>
