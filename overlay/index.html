<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
    <title>AVO pointer</title>
    <style>
      /* Black and white only. The agent's pointer is the "A" of AVO: a white
         chevron with a black rim, the inverse of the user's own black arrow. */
      :root {
        --glide: 450ms;
        --ink: #111;
        --shadow: 0 6px 16px rgba(0, 0, 0, 0.22), 0 1px 3px rgba(0, 0, 0, 0.18);
      }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        pointer-events: none;
        user-select: none;
        -webkit-font-smoothing: antialiased;
        font: 500 12px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      }

      #cursor {
        position: absolute;
        left: 0;
        top: 0;
        opacity: 0;
        transform: translate(-100px, -100px);
        transition: transform var(--glide) cubic-bezier(0.22, 1, 0.36, 1), opacity 250ms ease;
        z-index: 3;
      }
      #cursor.on { opacity: 1; }
      .arrow {
        position: absolute;
        left: -16px; /* puts the chevron's tip (16,2 in the viewBox) on the point */
        top: -2px;
        width: 32px;
        height: 36px;
        overflow: visible;
        transform-origin: 16px 2px;
        transition: transform 140ms ease;
        filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.3));
      }
      #cursor.press .arrow { transform: scale(0.8); }
      .tag, .chip {
        position: absolute;
        left: 17px;
        background: rgba(17, 17, 17, 0.92);
        color: #fff;
        box-shadow: var(--shadow);
        white-space: nowrap;
      }
      .tag {
        top: 25px;
        padding: 3px 7px 3px 8px;
        border-radius: 7px;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.14em;
      }
      .chip {
        top: 50px;
        max-width: 360px;
        padding: 6px 11px;
        border-radius: 10px;
        font-size: 12.5px;
        overflow: hidden;
        text-overflow: ellipsis;
        opacity: 0;
        transform: translateY(-4px) scale(0.96);
        transform-origin: top left;
        transition: opacity 180ms ease, transform 180ms ease;
      }
      .chip.on { opacity: 1; transform: none; }

      .ripple {
        position: absolute;
        width: 36px;
        height: 36px;
        margin: -18px 0 0 -18px;
        border-radius: 50%;
        border: 1.5px solid #fff;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(0, 0, 0, 0.25);
        animation: ripple 520ms cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
        z-index: 2;
      }
      @keyframes ripple {
        from { transform: scale(0.35); opacity: 1; }
        to { transform: scale(1.5); opacity: 0; }
      }

      /* "Is this the one?": dim the screen, ring the target. The question itself
         is a separate glass window (bubble.html). */
      body.asking { pointer-events: auto; }
      body.asking .tag { opacity: 0; }
      body.correcting { cursor: crosshair; }
      #spot {
        position: absolute;
        border-radius: 12px;
        box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.34), 0 0 0 1.5px #fff, 0 0 18px 2px rgba(255, 255, 255, 0.45);
        opacity: 0;
        transition: opacity 220ms ease, left 300ms ease, top 300ms ease, width 300ms ease, height 300ms ease;
        animation: breathe 1.8s ease-in-out infinite;
        z-index: 1;
      }
      #spot.on { opacity: 1; }
      body.correcting #spot { box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.16), 0 0 0 1px rgba(255, 255, 255, 0.6); animation: none; }
      @keyframes breathe {
        50% { box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.34), 0 0 0 1.5px #fff, 0 0 28px 6px rgba(255, 255, 255, 0.7); }
      }
    </style>
  </head>
  <body>
    <div id="cursor">
      <svg class="arrow" viewBox="0 0 32 36" aria-hidden="true">
        <g transform="rotate(-24 16 2)">
          <path d="M16 2 L27 31 L16 24.5 L5 31 Z" fill="#fff" stroke="#111" stroke-width="1.7" stroke-linejoin="round" />
        </g>
      </svg>
      <span class="tag">AVO</span>
      <span class="chip"></span>
    </div>
    <div id="spot"></div>

    <script>
      const cursor = document.getElementById("cursor");
      const chip = cursor.querySelector(".chip");
      const spot = document.getElementById("spot");

      let pos = null;
      let chipTimer = null;
      let hideTimer = null;
      let asking = false;

      const KEY_GLYPHS = {
        cmd: "⌘", command: "⌘", meta: "⌘", super: "⌘",
        ctrl: "⌃", control: "⌃", alt: "⌥", option: "⌥", shift: "⇧",
        enter: "↩", return: "↩", tab: "⇥", esc: "esc", escape: "esc",
        backspace: "⌫", delete: "⌦", space: "space",
        up: "↑", down: "↓", left: "←", right: "→",
        arrowup: "↑", arrowdown: "↓", arrowleft: "←", arrowright: "→",
      };

      function moveTo(x, y, ms = 450) {
        clearTimeout(hideTimer);
        if (!pos) {
          // First appearance: start from screen centre so the glide is visible.
          cursor.style.transition = "none";
          cursor.style.transform = `translate(${innerWidth / 2}px, ${innerHeight / 2}px)`;
          cursor.getBoundingClientRect(); // commit the start position
          cursor.style.transition = "";
        }
        cursor.style.setProperty("--glide", `${ms}ms`);
        cursor.classList.add("on");
        cursor.style.transform = `translate(${x}px, ${y}px)`;
        pos = { x, y };
      }

      function press() {
        cursor.classList.add("press");
        setTimeout(() => cursor.classList.remove("press"), 140);
      }

      function ripple(x, y) {
        const r = document.createElement("div");
        r.className = "ripple";
        r.style.left = `${x}px`;
        r.style.top = `${y}px`;
        document.body.appendChild(r);
        r.addEventListener("animationend", () => r.remove());
      }

      function showChip(text, ms = 1600) {
        chip.textContent = text;
        chip.classList.add("on");
        clearTimeout(chipTimer);
        chipTimer = setTimeout(() => chip.classList.remove("on"), ms);
      }

      function hideCursor() {
        cursor.classList.remove("on");
        chip.classList.remove("on");
        pos = null;
      }

      function placeSpot(m) {
        const pad = 6;
        let [l, t, r, b] = m.box || [m.x - 28, m.y - 18, m.x + 28, m.y + 18];
        l -= pad; t -= pad; r += pad; b += pad;
        Object.assign(spot.style, { left: `${l}px`, top: `${t}px`, width: `${r - l}px`, height: `${b - t}px` });
        spot.classList.add("on");
      }

      function endAsk() {
        asking = false;
        document.body.classList.remove("asking", "correcting");
        spot.classList.remove("on");
      }

      // After "No", the user's next click anywhere (outside the bubble window,
      // which sits above this one) is the corrected point.
      document.addEventListener("click", (e) => {
        if (!asking || !document.body.classList.contains("correcting")) return;
        ripple(e.clientX, e.clientY);
        moveTo(e.clientX, e.clientY, 200);
        window.avo.send("answer", { choice: "no", x: e.clientX, y: e.clientY });
        endAsk();
      });

      window.avo.onEvent((m) => {
        switch (m.type) {
          case "confirm":
            asking = true;
            document.body.classList.add("asking");
            document.body.classList.remove("correcting");
            moveTo(m.x, m.y, 450);
            placeSpot(m);
            break;
          case "correct":
            document.body.classList.add("correcting");
            break;
          case "answered":
          case "cancel":
            endAsk();
            break;
          case "move":
            moveTo(m.x, m.y, m.ms);
            break;
          case "click":
            moveTo(m.x, m.y, 0);
            press();
            ripple(m.x, m.y);
            if (m.button && m.button !== "left") showChip(m.button === "double" ? "Double-click" : `${m.button} click`);
            break;
          case "keys":
            showChip(m.keys.map((k) => KEY_GLYPHS[k.toLowerCase()] || k.toUpperCase()).join(" "));
            break;
          case "type":
            showChip(`Typing “${m.text}”`, 2200);
            break;
          case "scroll":
            showChip(m.dy > 0 ? "Scroll down" : "Scroll up");
            break;
          case "done":
            hideTimer = setTimeout(hideCursor, m.ms ?? 5000);
            break;
          case "hide":
            hideCursor();
            break;
        }
      });
    </script>
  </body>
</html>
