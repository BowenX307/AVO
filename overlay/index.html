<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
    <title>AVO pointer</title>
    <style>
      /* Black and white only. The agent's pointer is the "A" of AVO: a white
         chevron with a black rim, the inverse of the user's own black arrow. */
      :root {
        --glide: 450ms;
        --ink: #111;
        --shadow: 0 6px 16px rgba(0, 0, 0, 0.22), 0 1px 3px rgba(0, 0, 0, 0.18);
      }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        pointer-events: none;
        user-select: none;
        -webkit-font-smoothing: antialiased;
        font: 500 12px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      }

      #cursor {
        position: absolute;
        left: 0;
        top: 0;
        opacity: 0;
        transform: translate(-100px, -100px);
        transition: transform var(--glide) cubic-bezier(0.22, 1, 0.36, 1), opacity 250ms ease;
        z-index: 3;
      }
      #cursor.on { opacity: 1; }
      .arrow {
        position: absolute;
        left: -16px; /* puts the chevron's tip (16,2 in the viewBox) on the point */
        top: -2px;
        width: 32px;
        height: 36px;
        overflow: visible;
        transform-origin: 16px 2px;
        transition: transform 140ms ease;
        filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.3));
      }
      #cursor.press .arrow { transform: scale(0.8); }
      .tag, .chip {
        position: absolute;
        left: 17px;
        background: rgba(17, 17, 17, 0.92);
        color: #fff;
        box-shadow: var(--shadow);
        white-space: nowrap;
      }
      .tag {
        top: 25px;
        padding: 3px 7px 3px 8px;
        border-radius: 7px;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.14em;
      }
      .chip {
        top: 50px;
        max-width: 360px;
        padding: 6px 11px;
        border-radius: 10px;
        font-size: 12.5px;
        overflow: hidden;
        text-overflow: ellipsis;
        opacity: 0;
        transform: translateY(-4px) scale(0.96);
        transform-origin: top left;
        transition: opacity 180ms ease, transform 180ms ease;
      }
      .chip.on { opacity: 1; transform: none; }

      .ripple {
        position: absolute;
        width: 36px;
        height: 36px;
        margin: -18px 0 0 -18px;
        border-radius: 50%;
        border: 1.5px solid #fff;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(0, 0, 0, 0.25);
        animation: ripple 520ms cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
        z-index: 2;
      }
      @keyframes ripple {
        from { transform: scale(0.35); opacity: 1; }
        to { transform: scale(1.5); opacity: 0; }
      }

      /* One dim layer for both asking and selecting; the rings / selections are
         holes cut into it (an SVG mask), so several of them never stack darker. */
      #dim { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 220ms ease; z-index: 1; }
      #dim.on { opacity: 1; }
      #dim .shade { fill: rgba(0, 0, 0, 0.34); transition: fill 200ms ease; }
      body.selecting #dim .shade { fill: rgba(0, 0, 0, 0.18); }
      body.correcting #dim .shade { fill: rgba(0, 0, 0, 0.14); }

      /* "Is this the one?" / "Which one?": ring the target(s). The question itself
         is a separate glass window (bubble.html). */
      body.asking, body.selecting { pointer-events: auto; }
      body.asking .tag { opacity: 0; }
      body.correcting, body.selecting { cursor: crosshair; }
      .ring {
        position: absolute;
        border-radius: 12px;
        box-shadow: 0 0 0 1.5px #fff, 0 0 18px 2px rgba(255, 255, 255, 0.45);
        animation: breathe 1.8s ease-in-out infinite;
        z-index: 2;
      }
      body.correcting .ring { animation: none; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.6); }
      body.picking .ring { cursor: pointer; }
      body.picking .ring:hover { box-shadow: 0 0 0 2.5px #fff, 0 0 26px 6px rgba(255, 255, 255, 0.7); }
      @keyframes breathe { 50% { box-shadow: 0 0 0 1.5px #fff, 0 0 28px 6px rgba(255, 255, 255, 0.7); } }
      .label {
        position: absolute;
        left: -1px;
        bottom: calc(100% + 7px);
        padding: 3px 8px;
        border-radius: 7px;
        background: rgba(17, 17, 17, 0.92);
        color: #fff;
        font-size: 11.5px;
        font-weight: 600;
        white-space: nowrap;
        box-shadow: var(--shadow);
      }
      .label i { font-style: normal; font-weight: 500; opacity: 0.6; }
      /* Candidates are often stacked (menu items): name each one to its right. */
      .ring .label { left: calc(100% + 10px); bottom: auto; top: 50%; transform: translateY(-50%); }

      /* Box selection: the user drags A, then optionally B. */
      .sel {
        position: absolute;
        border-radius: 8px;
        box-shadow: 0 0 0 1.5px #fff, 0 0 0 2.5px rgba(0, 0, 0, 0.35);
        z-index: 2;
        transition: opacity 300ms ease;
      }
      .sel.live { box-shadow: 0 0 0 1.5px #fff, 0 0 0 2.5px rgba(0, 0, 0, 0.35), inset 0 0 0 9999px rgba(255, 255, 255, 0.06); }
      .sel.faint { opacity: 0.5; box-shadow: 0 0 0 1px #fff, 0 0 0 2px rgba(0, 0, 0, 0.25); }
      .sel .label { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; }
      .sel img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border-radius: 8px;
        opacity: 0;
        transition: opacity 400ms ease;
      }
      .sel img.on { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="cursor">
      <svg class="arrow" viewBox="0 0 32 36" aria-hidden="true">
        <g transform="rotate(-24 16 2)">
          <path d="M16 2 L27 31 L16 24.5 L5 31 Z" fill="#fff" stroke="#111" stroke-width="1.7" stroke-linejoin="round" />
        </g>
      </svg>
      <span class="tag">AVO</span>
      <span class="chip"></span>
    </div>
    <svg id="dim" aria-hidden="true">
      <defs><mask id="holes"><rect width="100%" height="100%" fill="#fff" /><g id="hole-list"></g></mask></defs>
      <rect class="shade" width="100%" height="100%" mask="url(#holes)" />
    </svg>
    <div id="marks"></div>

    <script>
      const cursor = document.getElementById("cursor");
      const chip = cursor.querySelector(".chip");
      const dim = document.getElementById("dim");
      const holeList = document.getElementById("hole-list");
      const marks = document.getElementById("marks"); // rings and selections
      const SVG = "http://www.w3.org/2000/svg";

      let pos = null;
      let chipTimer = null;
      let hideTimer = null;
      let asking = false;

      const KEY_GLYPHS = {
        cmd: "⌘", command: "⌘", meta: "⌘", super: "⌘",
        ctrl: "⌃", control: "⌃", alt: "⌥", option: "⌥", shift: "⇧",
        enter: "↩", return: "↩", tab: "⇥", esc: "esc", escape: "esc",
        backspace: "⌫", delete: "⌦", space: "space",
        up: "↑", down: "↓", left: "←", right: "→",
        arrowup: "↑", arrowdown: "↓", arrowleft: "←", arrowright: "→",
      };

      function moveTo(x, y, ms = 450) {
        clearTimeout(hideTimer);
        if (!pos) {
          // First appearance: start from screen centre so the glide is visible.
          cursor.style.transition = "none";
          cursor.style.transform = `translate(${innerWidth / 2}px, ${innerHeight / 2}px)`;
          cursor.getBoundingClientRect(); // commit the start position
          cursor.style.transition = "";
        }
        cursor.style.setProperty("--glide", `${ms}ms`);
        cursor.classList.add("on");
        cursor.style.transform = `translate(${x}px, ${y}px)`;
        pos = { x, y };
      }

      function press() {
        cursor.classList.add("press");
        setTimeout(() => cursor.classList.remove("press"), 140);
      }

      function ripple(x, y) {
        const r = document.createElement("div");
        r.className = "ripple";
        r.style.left = `${x}px`;
        r.style.top = `${y}px`;
        document.body.appendChild(r);
        r.addEventListener("animationend", () => r.remove());
      }

      function showChip(text, ms = 1600) {
        chip.textContent = text;
        chip.classList.add("on");
        clearTimeout(chipTimer);
        chipTimer = setTimeout(() => chip.classList.remove("on"), ms);
      }

      function hideCursor() {
        cursor.classList.remove("on");
        chip.classList.remove("on");
        pos = null;
      }

      // ---- dim layer with holes ----
      function setHoles(boxes) {
        holeList.replaceChildren(
          ...boxes.map(([l, t, r, b]) => {
            const h = document.createElementNS(SVG, "rect");
            for (const [k, v] of Object.entries({ x: l, y: t, width: r - l, height: b - t, rx: 10, fill: "#000" })) h.setAttribute(k, v);
            return h;
          }),
        );
      }

      function place(el, [l, t, r, b]) {
        Object.assign(el.style, { left: `${l}px`, top: `${t}px`, width: `${r - l}px`, height: `${b - t}px` });
      }

      function labelled(cls, box, text, extra) {
        const el = document.createElement("div");
        el.className = cls;
        place(el, box);
        const tag = document.createElement("span");
        tag.className = "label";
        tag.textContent = text;
        if (extra) tag.insertAdjacentHTML("beforeend", ` <i>· ${extra}</i>`);
        el.appendChild(tag);
        marks.appendChild(el);
        return el;
      }

      // ---- asking: ring the target, or every candidate of an ambiguous click ----
      function ask(m) {
        asking = true;
        document.body.classList.add("asking");
        document.body.classList.remove("correcting");
        document.body.classList.toggle("picking", !!m.candidates);
        marks.querySelectorAll(".ring").forEach((r) => r.remove());
        const pad = 6;
        const grow = ([l, t, r, b]) => [l - pad, t - pad, r + pad, b + pad];
        const targets = m.candidates
          ? m.candidates.map((c) => ({ box: grow(c.box), label: c.label, guess: c.guess }))
          : [{ box: grow(m.box || [m.x - 28, m.y - 18, m.x + 28, m.y + 18]) }];
        targets.forEach((t, i) => {
          const ring = t.label ? labelled("ring", t.box, t.label, t.guess ? "AVO's guess" : "") : labelled("ring", t.box, "");
          if (!t.label) ring.querySelector(".label").remove();
          ring.addEventListener("click", (e) => {
            if (document.body.classList.contains("correcting")) return;
            e.stopPropagation(); // a ring answers directly: this candidate, or "yes, that one"
            window.avo.send("answer", m.candidates ? { choice: "pick", index: i } : { choice: "yes" });
            endAsk();
          });
        });
        setHoles(targets.map((t) => t.box));
        dim.classList.add("on");
        moveTo(m.x, m.y, 450);
      }

      function endAsk() {
        asking = false;
        document.body.classList.remove("asking", "correcting", "picking");
        marks.querySelectorAll(".ring").forEach((r) => r.remove());
        if (!document.body.classList.contains("selecting")) dim.classList.remove("on");
      }

      // While asking, a click anywhere outside the rings (and outside the bubble
      // window above) is the user pointing at the right spot themselves, with or
      // without pressing "No" first.
      document.addEventListener("click", (e) => {
        if (!asking) return;
        ripple(e.clientX, e.clientY);
        moveTo(e.clientX, e.clientY, 200);
        window.avo.send("answer", { choice: "no", x: e.clientX, y: e.clientY });
        endAsk();
      });

      // ---- box selection: drag A, then optionally B ----
      let regions = []; // [{label, box, el}]
      let drag = null;

      function clearRegions() {
        regions.forEach((r) => r.el.remove());
        regions = [];
      }

      function endSelect(keep) {
        document.body.classList.remove("selecting");
        drag?.el.remove();
        drag = null;
        if (!asking) dim.classList.remove("on");
        if (keep) regions.forEach((r) => r.el.classList.add("faint"));
        else clearRegions();
      }

      document.addEventListener("mousedown", (e) => {
        if (!document.body.classList.contains("selecting") || e.button !== 0) return;
        const el = document.createElement("div");
        el.className = "sel live";
        marks.appendChild(el);
        drag = { x: e.clientX, y: e.clientY, el };
        place(el, [e.clientX, e.clientY, e.clientX, e.clientY]);
      });
      document.addEventListener("mousemove", (e) => {
        if (!drag) return;
        place(drag.el, [Math.min(drag.x, e.clientX), Math.min(drag.y, e.clientY), Math.max(drag.x, e.clientX), Math.max(drag.y, e.clientY)]);
      });
      document.addEventListener("mouseup", (e) => {
        if (!drag) return;
        const box = [Math.min(drag.x, e.clientX), Math.min(drag.y, e.clientY), Math.max(drag.x, e.clientX), Math.max(drag.y, e.clientY)];
        drag.el.remove();
        drag = null;
        if (box[2] - box[0] < 8 || box[3] - box[1] < 8) return; // a click, not a drag
        if (regions.length === 2) regions.pop().el.remove(); // a third drag redoes B
        const label = regions.length ? "B" : "A";
        const el = labelled("sel", box, label);
        regions.push({ label, box, el });
        setHoles(regions.map((r) => r.box));
        window.avo.send("select-box", { label, box });
      });

      // The agent's reading of each selection: SAM's mask, faded in over the box.
      function showRegionMasks(list) {
        for (const r of list) {
          const sel = regions.find((x) => x.label === r.label);
          if (!sel || !r.mask) continue;
          const img = new Image();
          img.src = r.mask;
          sel.el.appendChild(img);
          requestAnimationFrame(() => img.classList.add("on"));
          setTimeout(() => img.classList.remove("on"), 2600);
        }
      }

      window.avo.onEvent((m) => {
        switch (m.type) {
          case "confirm":
            ask(m);
            break;
          case "select-start":
            clearRegions();
            setHoles([]);
            document.body.classList.add("selecting");
            dim.classList.add("on");
            break;
          case "select-end":
            endSelect(m.keep);
            break;
          case "regions":
            showRegionMasks(m.regions || []);
            break;
          case "correct":
            document.body.classList.add("correcting");
            break;
          case "answered":
          case "cancel":
            endAsk();
            break;
          case "move":
            moveTo(m.x, m.y, m.ms);
            break;
          case "click":
            moveTo(m.x, m.y, 0);
            press();
            ripple(m.x, m.y);
            if (m.button && m.button !== "left") showChip(m.button === "double" ? "Double-click" : `${m.button} click`);
            break;
          case "snap":
            showChip(m.label ? `Snapped to “${m.label}”` : "Snapped to the nearest control", 1400);
            break;
          case "keys":
            showChip(m.keys.map((k) => KEY_GLYPHS[k.toLowerCase()] || k.toUpperCase()).join(" "));
            break;
          case "type":
            showChip(`Typing “${m.text}”`, 2200);
            break;
          case "scroll":
            showChip(m.dy > 0 ? "Scroll down" : "Scroll up");
            break;
          case "done":
            hideTimer = setTimeout(hideCursor, m.ms ?? 5000);
            endSelect(false);
            break;
          case "hide":
            hideCursor();
            break;
        }
      });
    </script>
  </body>
</html>
