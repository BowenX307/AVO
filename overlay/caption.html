<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
    <title>AVO caption</title>
    <style>
      /* The window is transparent; the pill draws its own glass, so its shape and
         shadow are ours rather than the system panel's. MARGIN leaves room for the
         shadow and the thinking glow inside the window. */
      :root {
        --margin: 22px;
        --ink: rgba(0, 0, 0, 0.84);
        --accent-a: #2f7bff;
        --accent-b: #9b5cff;
        --accent-c: #ff6fb1;
      }
      @property --spin {
        syntax: "<angle>";
        inherits: false;
        initial-value: 0deg;
      }
      html, body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-font-smoothing: antialiased;
        font: 500 14px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        color: var(--ink);
      }
      #wrap { padding: var(--margin); width: max-content; }
      #pill {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        max-width: 620px;
        min-height: 40px;
        padding: 9px 18px 9px 12px;
        box-sizing: border-box;
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(246, 247, 251, 0.93));
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 1),
          inset 0 -1px 0 rgba(0, 0, 0, 0.04),
          0 0 0 0.5px rgba(0, 0, 0, 0.12),
          0 10px 28px rgba(20, 30, 80, 0.16),
          0 2px 6px rgba(0, 0, 0, 0.08);
      }
      /* Thinking: a slowly turning blue-violet rim, plus a soft glow under it. */
      #pill::before, #pill::after {
        content: "";
        position: absolute;
        inset: -1.5px;
        border-radius: 23.5px;
        background: conic-gradient(from var(--spin), var(--accent-a), var(--accent-b), var(--accent-c), var(--accent-a));
        opacity: 0;
        transition: opacity 300ms ease;
        animation: spin 2.4s linear infinite;
        pointer-events: none;
      }
      #pill::before {
        padding: 1.5px;
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
      }
      #pill::after { z-index: -1; filter: blur(10px); }
      #pill.busy::before { opacity: 0.9; }
      #pill.busy::after { opacity: 0.35; }
      @keyframes spin { to { --spin: 360deg; } }

      .icon { flex: none; width: 22px; height: 22px; display: grid; place-items: center; }
      .mark { width: 18px; height: 20px; overflow: visible; }
      #pill.busy .mark { animation: bob 1.2s ease-in-out infinite; }
      @keyframes bob { 50% { transform: translateY(-1.5px) scale(1.06); } }
      .badge {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        display: grid;
        place-items: center;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 1px 3px rgba(0, 0, 0, 0.15);
      }
      .badge.ok { background: linear-gradient(180deg, #45d16a, #2fb350); }
      .badge.warn { background: linear-gradient(180deg, #ffb340, #ff9500); }
      #text {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
        white-space: pre-line;
        letter-spacing: -0.005em;
      }
      /* Shimmer across the words while waiting on the model. */
      #pill.busy #text {
        background: linear-gradient(100deg, rgba(0, 0, 0, 0.78) 40%, rgba(120, 110, 255, 0.95) 50%, rgba(0, 0, 0, 0.78) 60%);
        background-size: 250% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: shimmer 1.8s linear infinite;
      }
      @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -150% 0; } }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="pill">
        <span class="icon" id="icon"></span>
        <span id="text"></span>
      </div>
    </div>
    <script>
      const wrap = document.getElementById("wrap");
      const pill = document.getElementById("pill");
      const icon = document.getElementById("icon");
      const text = document.getElementById("text");
      let hideTimer = null;

      // The AVO "A" chevron, same shape as the agent pointer.
      const MARK = `<svg class="mark" viewBox="0 0 32 36" aria-hidden="true">
        <defs><linearGradient id="m" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#2f7bff" /><stop offset="1" stop-color="#9b5cff" />
        </linearGradient></defs>
        <path d="M16 2 L27 31 L16 24.5 L5 31 Z" fill="url(#m)" stroke="url(#m)" stroke-width="2" stroke-linejoin="round" />
        <path d="M16 7 L9 26" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity="0.7" />
      </svg>`;

      function show(message, kind) {
        clearTimeout(hideTimer);
        icon.innerHTML =
          kind === "ok" ? '<span class="badge ok">✓</span>'
          : kind === "warn" ? '<span class="badge warn">!</span>'
          : MARK;
        pill.classList.toggle("busy", kind === "busy");
        text.textContent = message;
        requestAnimationFrame(() => {
          const r = wrap.getBoundingClientRect();
          window.avo.send("caption-size", { width: r.width, height: r.height });
        });
      }

      window.avo.onEvent((m) => {
        if (m.type === "status") show(m.text, m.busy ? "busy" : "info");
        else if (m.type === "done") {
          show(m.text, m.ok === false ? "warn" : "ok");
          hideTimer = setTimeout(() => window.avo.send("caption-hide"), m.ms ?? 5000);
        } else if (m.type === "hide") window.avo.send("caption-hide");
      });
    </script>
  </body>
</html>
