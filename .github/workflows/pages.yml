# Publish site/ to GitHub Pages.
#
# Manual for now (Actions → "Deploy site" → Run workflow): the repo stays
# private until submission. Before the first run, set Settings → Pages →
# Source to "GitHub Actions". To publish on every push to main instead, add:
#   push:
#     branches: [main]
#     paths: ["site/**", "brand/**"]
name: Deploy site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # site/brand is a link to brand/ (shared with the overlay); copy the real files.
      - name: Assemble the site
        run: cp -RL site _site
      - name: Verify public evidence and site links
        run: |
          python3 scripts/check_site.py
          python3 scripts/check_evidence.py
          node --check site/assets/site.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
