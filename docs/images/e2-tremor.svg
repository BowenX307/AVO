<title id="t">Hit rate by button size, with a simulated tremor</title>
<desc id="d">30 simulated clicks per point. Alone, a 12 px button is hit 23% of the time at 12 px of tremor; with a rough box and the button's name, AVO hits every time.</desc>
<style>
.bg{fill:#F5F5F2}.ink{fill:#0A0A0A}.muted{fill:#6B6B68}.grid{stroke:#D9D9D6;stroke-width:1}
.s0{stroke:#A0A09C}.f0{fill:#A0A09C}.s4{stroke:#707070}.f4{fill:#707070}.s8{stroke:#404040}.f8{fill:#404040}.s12{stroke:#0A0A0A}.f12{fill:#0A0A0A}
